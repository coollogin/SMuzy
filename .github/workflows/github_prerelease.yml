name: Prerelease Development Build

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*-dev*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle
          bash ./gradlew assembleSmuzyDebug

      - name: Sign Debug APK
        id: sign_smuzy
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/smuzy/debug
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Create Prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SMuzy ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Development prerelease from commit ${{ github.sha }}

            **Note:** This is a prerelease and may be unstable.
            **Branch:** SMuzy-customization
            **Build type:** Debug (signed with release keystore)
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/smuzy/debug/*-signed.apk
