name: Github Release Workflow

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-dev') }}
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        id: build
        run: |
          sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle
          bash ./gradlew assembleSmuzyRelease

      - name: Sign Release APK
        id: sign_release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/smuzy/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Rename Signed APK
        run: |
          for file in app/build/outputs/apk/smuzy/release/*-signed.apk; do
            mv "$file" app/build/outputs/apk/smuzy/release/SMuzy-${{ github.ref_name }}.apk
          done

      - name: Compress Mapping File
        run: |
          mv -v app/build/outputs/mapping/smuzyRelease/mapping.txt app/build/outputs/mapping/smuzyRelease/mapping_SMuzy.txt
          gzip -v app/build/outputs/mapping/smuzyRelease/mapping_SMuzy.txt

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SMuzy ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: false
          files: |
            app/build/outputs/apk/smuzy/release/SMuzy-${{ github.ref_name }}.apk
            app/build/outputs/mapping/smuzyRelease/mapping_SMuzy.txt.gz
